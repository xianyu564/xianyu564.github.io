selected:
  - id: "enterprise-ai"
    period: "2026–Present"
    title_zh: "企业级 AI 与智能自动化"
    title_en: "Enterprise AI & Intelligent Automation"
    role_zh: "核心贡献者"
    role_en: "Core contributor"
    description_zh: "参与大型银行科技环境中的 AI 软件开发与智能自动化。"
    description_en: "Contributing to AI-enabled software development and intelligent automation within a large-scale banking technology environment."
    bullets_zh:
      - "参与 AI 软件开发、智能自动化及相关端到端验证。"
      - "与工程、架构及业务团队协作，推进系统集成、测试、缺陷修复和迭代交付。"
    bullets_en:
      - "Contribute to AI-enabled software development, intelligent automation, and related end-to-end validation."
      - "Collaborate across engineering, architecture, and business teams on integration, testing, defect resolution, and iterative delivery."

  - id: "ai-solutions"
    period: "2025–2026"
    title_zh: "AI 解决方案开发及交付"
    title_en: "AI Solutions Development & Delivery"
    role_zh: "算法负责人"
    role_en: "Algorithm lead"
    description_zh: "围绕计算机视觉质量评估、语料索引、RAG、大模型微调与应用原型开展开发和交付。"
    description_en: "Developed and delivered AI/LLM applications spanning computer vision, corpus indexing, RAG, model fine-tuning, red-teaming, and application prototyping."
    bullets_zh:
      - "化学合成质量评估：开发计算机视觉算法批量解析颗粒图像，输出粒径分布、扩散等统计指标。"
      - "网络爬虫：自动化实现微信公众号的克隆、索引和增量更新，构建约 80 万字中文语料数据库。"
      - "医院门诊、风险决策 App：设计前端 UI 原型；开发后端大模型提示词工程、RAG、红队测试和攻击拦截。"
      - "大模型微调：面向本地代码仓业务流程和规划问答，开发自动生成训练推理数据的方法；基于 Qwen2.5，使用 PEFT/QLoRA、Unsloth 与 Hugging Face 开展微调，完成推理评估及部署打包。"
    bullets_en:
      - "Chemical QA: applied computer vision to particle images to quantify particle-size distributions and diffusion statistics."
      - "Web crawl: indexed and incrementally maintained a WeChat Official Account corpus of roughly 800k Chinese characters."
      - "App development: prototyped UI and developed prompt engineering with RAG, red-teaming, and guardrails for outpatient and risk-decision applications."
      - "LLM fine-tuning: built repository-grounded training-data workflows; fine-tuned Qwen2.5 with PEFT/QLoRA using Unsloth and Hugging Face, evaluated inference, and packaged the model for deployment."
    links:
      - label: "Public training-data project"
        url: "https://github.com/xianyu564/local-training-dataset-generator"

  - id: "molecule-generation"
    period: "2024–2026"
    title_zh: "AI 分子生成与化学信息学评估"
    title_en: "AI Molecule Generation & Cheminformatics Evaluation"
    role_zh: "模拟负责人"
    role_en: "Simulation & evaluation"
    description_zh: "使用 Boltz-2、AlphaFold 与分子模拟开展多尺度生物分子复合物预测、互作评估和靶点探索。"
    description_en: "Applied Boltz-2, AlphaFold, and molecular simulation to multi-scale biomolecular complex prediction, interaction assessment, and target exploration."
    bullets_zh:
      - "使用 Boltz-2 预测小分子–蛋白质复合物结构及结合亲和力，交叉评估候选互作位点。"
      - "使用 AlphaFold 预测多尺度生物分子复合物，包括 Amlexanox–IKKε、FOXO4-DRI–FOXO6、IKBKE–CTNB1、hsa-miR-24-3p–TNF-α 等；在 PBS 集群开展后续互作分析，识别候选关键位点并指导湿实验设计，实验结果支持计算预测。"
      - "设计并初步实现未知靶点自动探索框架：将疾病机制文本映射至候选蛋白“探针”，经人类蛋白空间交叉验证和迭代分子模拟，输出可解释的靶点优先级。"
    bullets_en:
      - "Used Boltz-2 to predict small-molecule–protein complexes for cross-validation against the broader workflow."
      - "Used AlphaFold to model small-molecule–protein (Amlexanox–IKKε), peptide–protein (FOXO4-DRI–FOXO6), protein–protein (IKBKE–CTNB1), and miRNA–protein (hsa-miR-24-3p–TNF-α) complexes; analyzed interactions on a PBS cluster, identified candidate sites, and guided wet-lab perturbations, with experimental results supporting predictions."
      - "Designed and prototyped an automated target-exploration framework linking disease text to protein probes, human-proteome cross-validation, and iterative molecular-simulation prioritization."

  - id: "drug-repurposing"
    period: "2022–2024"
    title_zh: "AI 辅助老药新用与药靶计算化学验证"
    title_en: "AI-Assisted Drug Repurposing & Computational Chemistry Validation"
    role_zh: "博士核心课题"
    role_en: "Ph.D. core project"
    description_zh: "将多源文献、LLM、计算化学与细胞实验连接成“AI–计算–实验”闭环。"
    description_en: "Connected multi-source literature, LLMs, computational chemistry, and cell experiments into an AI–computation–experiment loop."
    bullets_zh:
      - "面向糖尿病伤口/糖尿病足溃疡治疗，构建 PubMed Central、Web of Science、miRTarBase、UniProt、DrugBank、ChEMBL、PubChem 等多源知识检索与对齐，整理约 9k 蛋白质 × 3k 潜在药物关联空间。"
      - "基于贪婪算法和化学信息学机器学习分别处理蛋白质和药物，并进行化学属性可解释性分析，将候选空间降至 50 蛋白质 × 35 药物。"
      - "评测通用/垂类大模型在生物医药 NLP 任务中的适用性，选用 GPT 完成约 4k 篇文献的命名实体识别与“疾病–蛋白质–药物”方向性关系抽取。"
      - "在 PBS/Slurm 超算集群搭建计算化学工作流，覆盖分子对接、分子动力学、量子化学和波函数分析；完整评估 50 × 35 共 1,750 组蛋白质–小分子组合。"
      - "耦合文献挖掘的定性调控与计算模拟的定量互作，排序潜在药物并逆向分析其化学特征。"
      - "优选叶酸，并在人源成纤维细胞和角质形成细胞增殖/迁移模型中完成体外验证。"
      - "开发光固化水凝胶载药配方，优化 3D 生物打印参数，完成 DMA 力学测试与药物缓释评估，提出个性化糖尿病创面护理原型。"
    bullets_en:
      - "Built multi-source retrieval and alignment across PubMed Central, Web of Science, miRTarBase, UniProt, DrugBank, ChEMBL, and PubChem, forming a ~9k-protein × ~3k-drug search space for diabetic wound and diabetic foot ulcer care."
      - "Applied greedy protein selection and cheminformatics ML with chemical-attribute interpretability, reducing the space to 50 proteins × 35 drugs."
      - "Benchmarked general and domain LLMs for biomedical NLP; used GPT for NER and relation extraction across ~4k papers to identify directional disease–protein–drug relationships."
      - "Implemented an HPC computational-chemistry pipeline on PBS/Slurm for docking, molecular dynamics, quantum chemistry, and wavefunction analysis; evaluated all 1,750 protein–ligand pairs."
      - "Coupled qualitative regulation from literature mining with quantitative molecular interactions to rank candidate drugs and reverse-analyze chemical features."
      - "Prioritized folic acid and validated the ranking in HDF and keratinocyte proliferation/migration models."
      - "Developed a light-curable drug-loaded hydrogel; optimized 3D bioprinting, DMA mechanics, and drug-release assessment for personalized diabetic wound care."
    links:
      - label: "Paper"
        url: "https://doi.org/10.1021/acsnanomed.5c00180"

  - id: "nanofiltration"
    period: "2019–2021"
    title_zh: "AI 化学合成预测与计算化学数据增强"
    title_en: "AI Chemical Synthesis Prediction & Computational Augmentation"
    role_zh: "本科核心课题"
    role_en: "B.Sc. core project"
    description_zh: "围绕聚酰胺纳滤膜建立理论化学知识增强与深度学习工作流。"
    description_en: "Built a theory-chemistry-informed augmentation and deep-learning workflow for polyamide nanofiltration membranes."
    bullets_zh:
      - "整理约 10² 组文献中的聚酰胺纳滤膜记录，将界面聚合制备信息作为输入、海水淡化性能作为输出。"
      - "使用 Gaussian 16 在 PBS 集群计算聚合物单体静态与振动特征，通过特征工程将 6 维工艺记录扩展为 444 维数据输入。"
      - "提出理论化学领域知识增强方法，将约 10² 条原始记录扩展至约 10⁶ 条训练样本并建立深度学习模型；测试集预测准确度为通量 71.1%、截留率 81.6%。"
    bullets_en:
      - "Curated roughly 10² literature records on polyamide nanofiltration membranes, using interfacial-polymerization synthesis information as input and desalination performance as output."
      - "Used Gaussian 16 on a PBS cluster to calculate static and vibrational descriptors of polymer monomers, expanding six-dimensional process records into 444-dimensional inputs through feature engineering."
      - "Developed theory-chemistry-informed augmentation to expand ~10² records to ~10⁶ training samples and trained deep-learning models, achieving 71.1% flux and 81.6% rejection accuracy on the test set."
    links:
      - label: "GitHub"
        url: "https://github.com/xianyu564/Nanofiltration-Membrane-Deep-Learning"

