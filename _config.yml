# Site settings
title: "张子阳 | Ziyang Zhang"
description: "AI Systems | AI for Science and Engineering | Computational Chemistry"
author: "Ziyang Zhang"
email: "z_zz@u.nus.edu"

# Site URL
url: "https://xianyu564.github.io"
baseurl: ""

# Theme
theme: jekyll-theme-minimal
remote_theme: pages-themes/minimal@v0.2.0

# Plugins
plugins:
  - jekyll-sitemap
  - jekyll-remote-theme

lang: zh-CN
languages: ["zh", "en"]
default_lang: zh

navigation:
  - title: "主页"
    url: /
  - title: "关于"
    url: /about/
  - title: "发表与学术"
    url: /publications/
  - title: "项目与开源"
    url: /projects/

navigation_en:
  - title: "Home"
    url: /en/
  - title: "About"
    url: /en/about/
  - title: "Publications"
    url: /en/publications/
  - title: "Projects"
    url: /en/projects/

social:
  github: "xianyu564"

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md

safe: false
incremental: false
