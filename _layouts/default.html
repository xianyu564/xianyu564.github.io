<!DOCTYPE html>
<html lang="{% if page.lang %}{{ page.lang }}{% elsif site.lang %}{{ site.lang }}{% else %}zh-CN{% endif %}">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  {% seo %}

  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  {% include head-custom.html %}
</head>
<body>
  {% include header.html %}

  <main class="main-content">
    <div class="wrapper">
      <article class="page-content">
        {{ content }}
      </article>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrapper">
      <div class="footer-content">
        <p>&copy; {{ 'now' | date: "%Y" }} {{ site.author | default: site.title }}.</p>
        <p>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
          &nbsp;&middot;&nbsp;
          <a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a>
          &nbsp;&middot;&nbsp;
          <a href="https://github.com/{{ site.social.github }}" target="_blank" rel="noopener noreferrer">GitHub</a>
        </p>
      </div>
    </div>
  </footer>
</body>
</html>
