<!-- Profile metadata and language alternates -->
<meta name="author" content="{{ site.author | default: site.title | escape }}">
<meta name="description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">

{% if page.lang == 'en' %}
<meta name="keywords" content="AI systems,AI for Science,large language models,computational chemistry,drug discovery,biomedical engineering,molecular dynamics,quantum chemistry">
{% assign zh_url = page.url | remove_first: '/en' %}
{% if zh_url == '' %}{% assign zh_url = '/' %}{% endif %}
<link rel="alternate" hreflang="zh-CN" href="{{ zh_url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ '/en/' | absolute_url }}">
{% else %}
<meta name="keywords" content="AI系统,AI for Science,大语言模型,计算化学,药物发现,生物医学工程,分子动力学,量子化学">
{% assign en_url = '/en' | append: page.url %}
<link rel="alternate" hreflang="zh-CN" href="{{ page.url | absolute_url }}">
<link rel="alternate" hreflang="en" href="{{ en_url | absolute_url }}">
<link rel="alternate" hreflang="x-default" href="{{ page.url | absolute_url }}">
{% endif %}

<meta property="og:title" content="{{ page.title | default: site.title | escape }}">
<meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:site_name" content="{{ site.title | escape }}">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page.title | default: site.title | escape }}">
<meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
